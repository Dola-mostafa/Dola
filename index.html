<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLA AI | بيجاوب على أي حاجة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial;background:#050005;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px 16px;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.6);border-bottom:1px solid rgba(168,85,247,.4)}
.avatar{width:50px;height:50px;border-radius:50%;background:#000;border:2px solid #a855f7;color:#a855f7;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;box-shadow:0 0 20px rgba(168,85,247,.7)}
.top h1{font-size:20px;margin:0}.top h1 span{color:#a855f7}
.top p{font-size:12px;color:#aaa;margin:2px 0 0}
.online{width:10px;height:10px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e}
.hero{text-align:center;padding:12px 16px 2px}
.hero h2{font-size:26px;margin:0;background:linear-gradient(90deg,#a855f7,#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.hero p{color:#aaa;font-size:13px;margin:6px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #a855f7;background:rgba(168,85,247,.15);color:#fff;cursor:pointer;font-size:13px;font-weight:700}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.7;animation:pop .3s;white-space:pre-wrap;word-break:break-word}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{background:#1a0b2e;border:1px solid #a855f7;border-bottom-right-radius:4px;align-self:flex-start}
.msg.user{background:linear-gradient(90deg,#a855f7,#7c3aed);align-self:flex-end;border-bottom-left-radius:4px}
.msg small{display:block;font-size:11px;color:#c084fc;margin-bottom:4px;font-weight:800}
.typing{display:flex;gap:5px;padding:12px 14px;background:#1a0b2e;border:1px solid #a855f7;border-radius:18px;width:70px}
.typing span{width:8px;height:8px;background:#a855f7;border-radius:50%;animation:bounce 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bottom{padding:12px;background:rgba(0,0,0,.7);border-top:1px solid rgba(168,85,247,.4);display:flex;gap:8px;align-items:center}
.bottom input{flex:1;padding:14px;border-radius:25px;border:1px solid #a855f7;background:#111;color:#fff;outline:none;font-size:15px}
.bottom button{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-size:22px;cursor:pointer}
.footer{text-align:center;font-size:11px;color:#666;padding:4px 0 8px;background:#000}
.footer a{color:#a855f7;text-decoration:none;font-weight:800}
</style>
</head>
<body>

<div class="top">
  <div class="avatar">Dola</div>
  <div style="flex:1">
    <h1>DOLA <span>AI</span> 💜</h1>
    <p>بيجاوب على أي حاجة - ذكاء حقيقي</p>
  </div>
  <div class="online"></div>
</div>

<div class="hero">
  <h2>اسألني أي حاجة 👑</h2>
  <p>رياضة، علوم، فري فاير، واجب، نكت، أي حاجة - انا هجاوبك</p>
</div>

<div class="chips">
  <button onclick="askMe('مين عادل؟')">👑 مين عادل؟</button>
  <button onclick="askMe('اشرح لي قانون نيوتن ببساطة')">📚 اشرح نيوتن</button>
  <button onclick="askMe('ازاي ابقى محترف فري فاير؟')">🔥 فري فاير</button>
  <button onclick="askMe('قولي نكتة تضحك')">😂 نكتة</button>
  <button onclick="askMe('ما هي عاصمة فرنسا؟')">🌍 عواصم</button>
  <button onclick="askMe('اكتب لي قصة قصيرة')">📖 قصة</button>
</div>

<div class="chat" id="chat">
  <div class="msg ai"><small>💜 DOLA AI</small>أهلاً بيك يا بطل 👑
انا DOLA AI الجديد، دلوقتي بقيت بفهم أي سؤال واجاوب عليه بجد.
اكتب أي حاجة تحت وجربني 👇</div>
</div>

<div class="bottom">
  <input id="input" placeholder="اسأل أي حاجة..." onkeydown="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">➤</button>
</div>
<div class="footer">صُنع بواسطة 👑 <a href="https://wa.me/201062056341">عادل 01062056341</a> | DOLA AI © 2026</div>

<script>
let chat = document.getElementById('chat');
let input = document.getElementById('input');
let history = [];

function askMe(text){ input.value = text; sendMsg(); }

async function sendMsg(){
  let text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  showTyping();

  // 1 - اسئلة عادل الخاصة - ترد بسرعة من غير نت
  let fast = getFastAnswer(text);
  if(fast){
    setTimeout(()=>{ removeTyping(); addMsg(fast, 'ai'); }, 500);
    return;
  }

  // 2 - اسئلة حسابية - يحسبها على طول
  let math = tryMath(text);
  if(math){
    setTimeout(()=>{ removeTyping(); addMsg(math, 'ai'); }, 500);
    return;
  }

  // 3 - أي سؤال تاني - يروح للذكاء الاصطناعي الحقيقي
  try{
    let prompt = "انت اسمك Dola AI، مساعد عادل الذكي، مصري، بتتكلم بالعامية المصرية ببساطة، وبتجاوب باختصار وبشكل روش ومفيد. صاحبك هو عادل، رقمه 01062056341. جاوب على السؤال ده: " + text;
    let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt), { method: 'GET' });
    let answer = await res.text();
    removeTyping();
    if(answer && answer.length > 2){
      // لو الاجابة طويلة اوي قصها شوية
      addMsg(answer.slice(0, 1500), 'ai');
    } else {
      addMsg("معلش يا بطل، النت علق ثانية 😅 جرب تسألني تاني.", 'ai');
    }
  }catch(e){
    removeTyping();
    addMsg("معلش النت فصل عندي 😅\nجرب تاني، أو اسألني: قولي نكتة، مين عادل؟، ازاي ابقى محترف فري فاير؟", 'ai');
  }
}

function addMsg(text, type){
  let div = document.createElement('div');
  div.className = 'msg ' + type;
  if(type==='ai') div.innerHTML = '<small>💜 DOLA AI</small>' + text;
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function showTyping(){
  let t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(t); chat.scrollTop = chat.scrollHeight;
}
function removeTyping(){ let t=document.getElementById('typing'); if(t) t.remove(); }

function getFastAnswer(q){
  let l = q.toLowerCase();
  if(l.includes('مين عادل') || l.includes('عادل')) return 'عادل ده ملك الملوك 👑🔥\nصاحب موقع DOLA AI، رقمه 01062056341\nأجدع واحد في الدنيا، لو عايز تكلمه: https://wa.me/201062056341';
  if(l.includes('صبري')) return 'صبري ده أخو عادل وصاحبه 👑\nرقمه: 01027436412\nراجل جدع جداً 💪';
  if(l.includes('شحن') || l.includes('جواهر')) return '💎 عايز تشحن جواهر فري فاير؟\nكلم عادل على طول، أرخص سعر وأسرع شحن 👑\n📞 01062056341\nhttps://wa.me/201062056341';
  if(l.includes('بحبك')) return 'وانا بحبك أكتر يا بطل 💜🥰\nانت أجدع واحد دخل الموقع ده النهارده!';
  return null;
}

function tryMath(q){
  // يشيل المسافات ويشوف لو كلها ارقام و + - * / 
  let clean = q.replace(/ /g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/x/g,'*');
  if(/^[0-9+\-*/().]+$/.test(clean) && clean.length > 2 && clean.length < 20){
    try{ let r = eval(clean); return '🧮 الناتج = ' + r + '\n\nعادل هو اللي علمني الحساب ده 😎'; }catch(e){ return null; }
  }
  return null;
}
</script>
</body>
</html>
